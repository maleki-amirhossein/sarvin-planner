<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00796e" />
    <meta name="robots" content="noindex, nofollow" />
    <title>اتصال اینترنت | سروین</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #faf8f5;
        color: #18343e;
        font:
          16px/2 Tahoma,
          Arial,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 440px;
        padding: 32px;
        border: 1px solid #e8e6e2;
        border-radius: 24px;
        background: white;
      }
      h1 {
        font-size: 24px;
      }
      p {
        color: #5a6870;
      }
      a {
        display: inline-block;
        padding: 10px 22px;
        border-radius: 12px;
        background: #00796e;
        color: white;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #00796e;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>سروین منتظر اتصال است</h1>
      <p>
        برای دیدن برنامه‌ها و ذخیرهٔ تغییرات به اینترنت نیاز دارید. اتصال را
        بررسی کنید و دوباره تلاش کنید.
      </p>
      <a href="">تلاش دوباره</a>
    </main>
  </body>
</html>
