name: sarvin-planner

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *default-logging
    networks: [database]
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sarvin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sarvin_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-sarvin}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    logging: *default-logging
    networks: [database]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ${API_IMAGE:-sarvin-planner-api:local}
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sarvin}:${POSTGRES_PASSWORD:-sarvin_local_only}@db:5432/${POSTGRES_DB:-sarvin}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    logging: *default-logging
    init: true
    stop_grace_period: 30s
    networks: [database, edge]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ${API_IMAGE:-sarvin-planner-api:local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      SESSION_SECRET: ${SESSION_SECRET:?Generate a random session secret}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOW_INSECURE_LOCAL_HTTP: ${ALLOW_INSECURE_LOCAL_HTTP:-false}
      TRUST_PROXY: ${TRUST_PROXY:-loopback,uniquelocal}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sarvin}:${POSTGRES_PASSWORD:-sarvin_local_only}@db:5432/${POSTGRES_DB:-sarvin}?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    image: ${WEB_IMAGE:-sarvin-planner-web:local}
    logging: *default-logging
    init: true
    stop_grace_period: 30s
    networks: [edge]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  caddy:
    logging: *default-logging
    networks: [edge]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTPS_PORT:-8443}:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  database:
  edge:
