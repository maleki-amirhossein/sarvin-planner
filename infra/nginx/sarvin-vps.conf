# Dedicated replacement VPS. HTTP serves only ACME challenges and redirects.
# The host-managed renewal timer reloads Nginx after successful certificate renewal.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 5.160.200.254;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/sarvin-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sarvin-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SarvinTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 64k;

    # Do not record private query strings or application paths in access logs.
    access_log off;
    error_log /var/log/nginx/sarvin-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Direct accidental HTTP requests on this TLS port to the canonical origin.
    error_page 497 =308 https://5.160.200.254$request_uri;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name 5.160.200.254;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://5.160.200.254$request_uri; }
}
