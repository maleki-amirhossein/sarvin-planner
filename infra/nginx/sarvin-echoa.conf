# Dedicated TLS listener; the existing Echoa virtual hosts own ports 80/443.
# The existing certbot timer and nginx deploy hook renew/reload this IP certificate.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name 87.107.160.160;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/echoa-api-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/echoa-api-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SarvinTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 64k;

    # Do not record private query strings or application paths in access logs.
    access_log off;
    error_log /var/log/nginx/sarvin-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Direct accidental HTTP requests on this TLS port to the canonical origin.
    error_page 497 =308 https://87.107.160.160:8443$request_uri;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
